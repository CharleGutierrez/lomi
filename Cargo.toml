[package]
name = "lomi"
version = "0.1.0"
edition = "2021"
description = "LOMI: LLM Optimization & Model Improver"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
chrono = "0.4"
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8.5"

# --- Heavy-Duty OS & GUI Components ---
tokio = { version = "1.37", features = ["full"] }
slint = "1.5"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"
aya = "0.12"
aya-log = "0.2"

[build-dependencies]
slint-build = "1.5"
