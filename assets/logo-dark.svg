<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        
        <!-- Glow Effects -->
        <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background (Transparent but styled for Dark Mode) -->
    <rect width="800" height="400" fill="transparent" />

    <g transform="translate(400, 200)">
        
        <!-- CAPABILITY 1: P2P Swarm & Global Networking (Outer Orbit) -->
        <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="20 15" />
        <circle cx="0" cy="0" r="140" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-dasharray="60 200" transform="rotate(45)" opacity="0.8">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
        </circle>
        
        <!-- Swarm Nodes -->
        <circle cx="-100" cy="-98" r="8" fill="#c084fc" filter="url(#glowCyan)" />
        <circle cx="120" cy="72" r="6" fill="#c084fc" filter="url(#glowCyan)" />
        <circle cx="-70" cy="121" r="10" fill="#c084fc" filter="url(#glowCyan)" />
        <path d="M -100 -98 L -40 -40 M 120 72 L 40 40 M -70 121 L -30 60" stroke="#c084fc" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4" />

        <!-- CAPABILITY 2: Firecracker Vault & Security (Shield Hexagon) -->
        <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#0f172a" stroke="url(#neonGreen)" stroke-width="6" opacity="0.9" filter="url(#glowGreen)" />
        <polygon points="0,-115 100,-57.7 100,57.7 0,115 -100,57.7 -100,-57.7" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4" />

        <!-- CAPABILITY 3: Waterfall Router & AST Squeezer (Data Tracks) -->
        <path d="M 0 -80 L 0 -150" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="10 5" opacity="0.7">
            <animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite"/>
        </path>
        <path d="M -69 -40 L -120 -70 M 69 -40 L 120 -70 M -69 40 L -120 70 M 69 40 L 120 70 M 0 80 L 0 150" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6">
            <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite"/>
        </path>

        <!-- CAPABILITY 4: Central LLM Core (Neural Brain) -->
        <circle cx="0" cy="0" r="45" fill="none" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glowCyan)" />
        <circle cx="0" cy="0" r="30" fill="url(#neonCyan)" opacity="0.2" />
        
        <!-- Neural network dots inside core -->
        <circle cx="-15" cy="-10" r="4" fill="#ffffff" />
        <circle cx="15" cy="-5" r="4" fill="#ffffff" />
        <circle cx="0" cy="15" r="4" fill="#ffffff" />
        <path d="M -15 -10 L 15 -5 L 0 15 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
        
        <!-- CAPABILITY 5: eBPF & HPC Speed Lines (Horizontal Acceleration) -->
        <g opacity="0.5" stroke="#38bdf8" stroke-width="2">
            <line x1="-300" y1="-20" x2="-150" y2="-20" />
            <line x1="-350" y1="20" x2="-120" y2="20" stroke-dasharray="20 10" />
            <line x1="150" y1="-20" x2="300" y2="-20" />
            <line x1="120" y1="20" x2="350" y2="20" stroke-dasharray="20 10" />
        </g>
    </g>

    <!-- Typography -->
    <g transform="translate(400, 360)">
        <text x="0" y="0" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="8">LOMI</text>
        <text x="0" y="24" font-family="'Arial', sans-serif" font-size="12" font-weight="normal" fill="#94a3b8" text-anchor="middle" letter-spacing="3">UNIVERSAL AGI GATEWAY</text>
    </g>
</svg>
